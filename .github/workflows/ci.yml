name: CI

on:
  schedule:
    - cron: "0 0 * * *"
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-opencv:
    name: Build OpenCV (${{ matrix.os.artifact-name || matrix.os.runner }})

    strategy:
      matrix:
        os:
          - runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_34_x86_64
            artifact-name: linux
          - runner: ubuntu-latest
            container: quay.io/pypa/musllinux_1_2_x86_64
            artifact-name: linux-musl
          - runner: windows-latest
          - runner: macos-latest

    defaults:
      run:
        shell: bash

    env:
      SCCACHE_GHA_ENABLED: true
      # Floor for macOS wheels (tag macosx_14_0_arm64, installable on 14+).
      # Must be set for both the OpenCV and the wheel builds so the static
      # libs and the extension share the same min-version; ignored elsewhere.
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    runs-on: ${{ matrix.os.runner }}
    container: ${{ matrix.os.container }}

    steps:
      - name: Get latest release
        id: latest-release
        run: |
          curl -Ls -o /dev/null -w %{url_effective} \
            https://github.com/opencv/opencv/releases/latest \
            | sed 's#.*tag/\(.*\)$#\1#' > latest-release.txt
          echo "tag=$(cat latest-release.txt)" >> $GITHUB_OUTPUT

      - uses: actions/checkout@main
        with:
          repository: opencv/opencv
          ref: ${{ steps.latest-release.outputs.tag }}

      # Default CMake generators are used (Makefiles on Linux/macOS, Visual
      # Studio on Windows) so no ninja setup is needed. This also avoids
      # actions stuck on the deprecated Node 20 runtime.
      - uses: mozilla-actions/sccache-action@main

      - uses: ilammy/msvc-dev-cmd@v1
        id: msvc-env
        if: startsWith(matrix.os.runner, 'windows')

      - name: Setup MSVC environment
        if: steps.msvc-env.conclusion == 'success'
        run: |
          echo "CC=cl" >> $GITHUB_ENV
          echo "CXX=cl" >> $GITHUB_ENV

      - name: CMake build
        run: |
          mkdir build
          cd build

          cmake .. \
            -D CMAKE_INSTALL_PREFIX=../opencv \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_C_COMPILER_LAUNCHER=sccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -D BUILD_LIST=core,imgproc,features,features2d \
            -D BUILD_SHARED_LIBS=OFF \
            -D ENABLE_CCACHE=ON \
            -D WITH_ADE=OFF \
            -D WITH_PROTOBUF=OFF \
            -D WITH_QUIRC=OFF \
            -D WITH_ITT=OFF \
            -D WITH_OPENEXR=OFF \
            -D WITH_WEBP=OFF \
            -D WITH_JASPER=OFF \
            -D WITH_OPENJPEG=OFF \
            -D WITH_JPEG=OFF \
            -D WITH_PNG=OFF \
            -D WITH_TIFF=OFF

          cmake --build . --target install --parallel $(nproc) --config Release

      - uses: actions/upload-artifact@main
        with:
          name: opencv-${{ matrix.os.artifact-name || matrix.os.runner }}
          path: ./opencv

  build:
    name: Build Wheel (${{ matrix.os.artifact-name || matrix.os.runner }}, Python ${{ matrix.python }})
    needs: [build-opencv]

    strategy:
      matrix:
        os:
          - runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_34_x86_64
            artifact-name: linux
          # - runner: ubuntu-latest
          #   container: quay.io/pypa/musllinux_1_2_x86_64
          #   artifact-name: linux-musl
          - runner: windows-latest
          - runner: macos-latest
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    env:
      # Must match build-opencv so the extension links cleanly against the
      # static OpenCV libs; wheels are tagged macosx_14_0_arm64.
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os.runner }}
    container: ${{ matrix.os.container }}

    steps:
      - uses: actions/checkout@main

      - uses: actions/download-artifact@main
        with:
          name: opencv-${{ matrix.os.artifact-name || matrix.os.runner }}
          path: ./opencv

      - uses: pdm-project/setup-pdm@main
        id: install-pdm
        if: ${{ !matrix.os.container }}
        with:
          python-version: ${{ matrix.python }}
          cache: true

      - name: Manually install PDM
        if: steps.install-pdm.conclusion == 'skipped'
        run: |
          pipx install pdm
          export PYTHONPATH=$(python${{matrix.python}} -c 'import sys; print(sys.exec_prefix)')

          echo "$PYTHONPATH" >> $GITHUB_PATH
          echo "$PYTHONPATH/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$PYTHONPATH/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "pythonLocation=$PYTHONPATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$PYTHONPATH/lib/pkgconfig" >> $GITHUB_ENV

          # Wheel builds use the ninja Python package from the isolated build
          # env (see pdm_build.py), so no system ninja is needed here.

      - name: Setup Windows environment
        id: msvc-env
        if: startsWith(matrix.os.runner, 'windows')
        run: |
          CV_DIR=$(find ./opencv/x64 | grep -i '\.cmake$' | head -n 1)
          echo "OpenCV_DIR=$(realpath $(dirname $CV_DIR))" >> $GITHUB_ENV
          echo "OpenCV_STATIC=ON" >> $GITHUB_ENV

      - name: Setup Unix environment
        if: steps.msvc-env.conclusion == 'skipped'
        run: |
          if [ -d "./opencv/lib64/cmake/opencv4" ]; then
            CV_DIR="./opencv/lib64/cmake/opencv4"
          elif [ -d "./opencv/lib/cmake/opencv4" ]; then
            CV_DIR="./opencv/lib/cmake/opencv4"
          else
            CV_CONFIG=$(find ./opencv -type f \( -name OpenCVConfig.cmake -o -name opencv-config.cmake \) | head -n 1)
            if [ -z "$CV_CONFIG" ]; then
              echo "OpenCVConfig.cmake not found under ./opencv"
              find ./opencv -maxdepth 4 -type d -print
              exit 1
            fi
            CV_DIR="$(dirname "$CV_CONFIG")"
          fi

          echo "OpenCV_DIR=$(realpath "$CV_DIR")" >> $GITHUB_ENV
          echo "OpenCV_STATIC=ON" >> $GITHUB_ENV

      - name: Build wheel
        run: pdm build -v

      - uses: actions/upload-artifact@main
        with:
          name: wheel-${{ matrix.os.artifact-name || matrix.os.runner }}-${{ matrix.python }}
          path: ./dist/*.whl

  test:
    name: Test Wheel (${{ matrix.os.artifact-name || matrix.os.runner }}, Python ${{ matrix.python }})
    needs: [build]

    strategy:
      matrix:
        os:
          - runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_34_x86_64
            artifact-name: linux
          # - runner: ubuntu-latest
          #   container: quay.io/pypa/musllinux_1_2_x86_64
          #   artifact-name: linux-musl
          - runner: windows-latest
          - runner: macos-latest
        # 3.10 tests skipped: test-env refresh (numpy>=2.3) requires >=3.11;
        # 3.10 wheels are still built and released.
        python: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os.runner }}
    container: ${{ matrix.os.container }}

    steps:
      - uses: actions/checkout@main

      - name: Download wheel
        uses: actions/download-artifact@main
        with:
          name: wheel-${{ matrix.os.artifact-name || matrix.os.runner }}-${{ matrix.python }}
          path: ./dist

      - uses: pdm-project/setup-pdm@main
        id: install-pdm
        if: ${{ !matrix.os.container }}
        with:
          python-version: ${{ matrix.python }}
          cache: true

      - name: Manually install PDM
        if: steps.install-pdm.conclusion == 'skipped'
        run: |
          pipx install pdm
          export PYTHONPATH=$(python${{matrix.python}} -c 'import sys; print(sys.exec_prefix)')

          echo "$PYTHONPATH" >> $GITHUB_PATH
          echo "$PYTHONPATH/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$PYTHONPATH/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "pythonLocation=$PYTHONPATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$PYTHONPATH/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pdm install -G test --no-self
          if ! pdm run python -m pip --version; then
            pdm run python -m ensurepip --upgrade
          fi
          # Locked opencv 4.10 / numpy 2.2 predate Python 3.14 and segfault on
          # `import cv2` on Windows; refresh both to versions with real
          # cp314 wheels.
          pdm run python -m pip install -U "opencv-python>=4.11" "numpy>=2.3"
          pdm run python -m pip install -v dist/*.whl

      - name: Run tests
        run: |
          pdm run pytest

  cleanup:
    name: Cleanup artifacts
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - uses: geekyeggo/delete-artifact@main
        with:
          name: opencv-*

      - uses: actions/download-artifact@main

      - name: Merge wheels
        run: |
          mkdir dist
          cp -f -v wheel-*/*.whl dist/

      - uses: actions/upload-artifact@main
        with:
          name: wheel-all
          path: ./dist/*.whl

  release:
    name: Release
    needs: [cleanup]
    if: startsWith(github.ref, 'refs/tags/v') && github.head_ref == ''
    runs-on: ubuntu-latest

    permissions:
      # Needed to create GitHub Release and upload assets.
      contents: write

    steps:
      - uses: actions/checkout@main

      - uses: actions/download-artifact@main
        with:
          name: wheel-all
          path: ./dist

      - uses: pdm-project/setup-pdm@main
        with:
          cache: true

      - name: Build sdist
        run: |
          # NOTE: --no-clean is required; pdm build wipes ./dist by default,
          # which would delete the wheels downloaded above.
          pdm build --no-wheel --no-clean

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" --generate-notes dist/*
          fi
